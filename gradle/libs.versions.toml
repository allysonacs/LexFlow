[versions]
spring-boot = "3.5.16"
# Precisa acompanhar o hibernate-core trazido pelo Spring Boot; o BOM não gerencia este módulo.
hibernate = "6.6.53.Final"
# AWS SDK v2: usado pelo storage de documentos, contra o S3 em produção e o MinIO em desenvolvimento.
awssdk = "2.54.19"

[libraries]
# BOM do Spring Boot: centraliza as versões de Spring, JUnit, Testcontainers etc.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

hibernate-vector = { module = "org.hibernate.orm:hibernate-vector", version.ref = "hibernate" }

# BOM do AWS SDK: alinha as versões dos módulos do SDK entre si.
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
# Serialização de java.time nos eventos da fila; declarado por vir, de outro modo, só por transitividade.
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-minio = { module = "org.testcontainers:minio" }
testcontainers-rabbitmq = { module = "org.testcontainers:rabbitmq" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core" }
awaitility = { module = "org.awaitility:awaitility" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
