[versions]
spring-boot = "3.5.16"
# Precisa acompanhar o hibernate-core trazido pelo Spring Boot; o BOM não gerencia este módulo.
hibernate = "6.6.53.Final"
# AWS SDK v2: usado pelo storage de documentos, contra o S3 em produção e o MinIO em desenvolvimento.
awssdk = "2.54.19"
# Apache Tika: extração de texto (nativo e OCR via Tesseract). A linha 4.x mudou a API de
# configuração e ainda é recente demais; a 3.x é a estável.
tika = "3.3.2"
# Resilience4j: circuit breaker, retry e time limiter do cliente LLM (Prompt 10).
resilience4j = "2.4.0"
# Validação das respostas estruturadas do LLM. A linha 1.5 usa o Jackson 2, o mesmo do Spring Boot 3.5;
# as linhas 2.x e 3.x mudaram a API, e a 3.x já exige o Jackson 3.
json-schema-validator = "1.5.9"
# Dublê HTTP do provedor de LLM nos testes. O artefato standalone embute o próprio Jetty.
wiremock = "3.13.2"

[libraries]
# BOM do Spring Boot: centraliza as versões de Spring, JUnit, Testcontainers etc.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-aop = { module = "org.springframework.boot:spring-boot-starter-aop" }
spring-boot-starter-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

hibernate-vector = { module = "org.hibernate.orm:hibernate-vector", version.ref = "hibernate" }

# Observabilidade (Prompt 18). As versões vêm do BOM do Spring Boot, que já alinha Micrometer,
# Micrometer Tracing e OpenTelemetry entre si.
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing = { module = "io.micrometer:micrometer-tracing" }
micrometer-tracing-test = { module = "io.micrometer:micrometer-tracing-test" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }

# BOM do AWS SDK: alinha as versões dos módulos do SDK entre si.
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
# BOM do Tika: alinha os módulos de parser entre si.
tika-bom = { module = "org.apache.tika:tika-bom", version.ref = "tika" }
tika-core = { module = "org.apache.tika:tika-core" }
tika-parser-pdf = { module = "org.apache.tika:tika-parser-pdf-module" }
tika-parser-microsoft = { module = "org.apache.tika:tika-parser-microsoft-module" }
tika-parser-ocr = { module = "org.apache.tika:tika-parser-ocr-module" }
resilience4j-spring-boot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
resilience4j-reactor = { module = "io.github.resilience4j:resilience4j-reactor", version.ref = "resilience4j" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
# Serialização de java.time nos eventos da fila; declarado por vir, de outro modo, só por transitividade.
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-minio = { module = "org.testcontainers:minio" }
testcontainers-rabbitmq = { module = "org.testcontainers:rabbitmq" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core" }
awaitility = { module = "org.awaitility:awaitility" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
