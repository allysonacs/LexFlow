spring:
  application:
    name: lexflow
  profiles:
    # Perfil usado quando nenhum outro é informado (ex.: SPRING_PROFILES_ACTIVE=prod)
    default: dev
  threads:
    virtual:
      enabled: true
  # Credenciais do banco já parametrizadas; passam a ser usadas quando a persistência entrar (Prompt 03)
  datasource:
    url: ${LEXFLOW_DB_URL}
    username: ${LEXFLOW_DB_USERNAME}
    password: ${LEXFLOW_DB_PASSWORD}
  jpa:
    hibernate:
      # O schema é do Flyway; o Hibernate apenas confere se as entidades batem com ele.
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${LEXFLOW_RABBITMQ_HOST:localhost}
    port: ${LEXFLOW_RABBITMQ_PORT:5672}
    username: ${LEXFLOW_RABBITMQ_USERNAME:lexflow}
    password: ${LEXFLOW_RABBITMQ_PASSWORD:lexflow}
    virtual-host: ${LEXFLOW_RABBITMQ_VHOST:/}
    listener:
      simple:
        # Uma demanda por vez em cada thread do consumidor; o paralelismo vem de mais réplicas.
        concurrency: ${LEXFLOW_RABBITMQ_CONCURRENCY:2}
        max-concurrency: ${LEXFLOW_RABBITMQ_MAX_CONCURRENCY:8}
        prefetch: 1
        # Mensagem rejeitada não volta para a fila: vai para a dead-letter, como manda o Prompt 07.
        # Sem isso, uma falha permanente entraria em laço infinito de reentrega.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: ${LEXFLOW_RABBITMQ_MAX_ATTEMPTS:4}
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
    template:
      retry:
        # Backoff também na publicação: um broker momentaneamente indisponível não pode
        # derrubar a ingestão (seção 11).
        enabled: true
        max-attempts: 3
        initial-interval: 500ms
        multiplier: 2

  servlet:
    multipart:
      # Limites da ingestão de documentos (Prompt 05). Acima disso a API responde 413.
      max-file-size: ${LEXFLOW_MAX_FILE_SIZE:25MB}
      max-request-size: ${LEXFLOW_MAX_REQUEST_SIZE:100MB}

# Storage de documentos (Prompt 06). Sem endpoint, o SDK fala com o S3 da AWS; com endpoint e
# path-style, com o MinIO local.
lexflow:
  storage:
    bucket: ${LEXFLOW_STORAGE_BUCKET:lexflow-documents}
    region: ${LEXFLOW_STORAGE_REGION:us-east-1}
    endpoint: ${LEXFLOW_STORAGE_ENDPOINT:}
    access-key: ${LEXFLOW_STORAGE_ACCESS_KEY:}
    secret-key: ${LEXFLOW_STORAGE_SECRET_KEY:}
    path-style-access: ${LEXFLOW_STORAGE_PATH_STYLE:false}
    create-bucket-if-missing: false
  # Administrador da API administrativa (/api/v1/admin/**, Prompt 09). A senha pode vir em texto ou já
  # no formato do Spring Security ({bcrypt}...). Em produção não há valor padrão: sem elas, não sobe.
  security:
    admin:
      username: ${LEXFLOW_ADMIN_USERNAME}
      password: ${LEXFLOW_ADMIN_PASSWORD}
  # Cliente LLM (Prompt 10). Sem chave, a aplicação sobe normalmente e só as chamadas ao LLM falham.
  llm:
    base-url: ${LEXFLOW_LLM_BASE_URL:https://api.anthropic.com}
    api-key: ${ANTHROPIC_API_KEY:}
    anthropic-version: 2023-06-01
    default-model: ${LEXFLOW_LLM_MODEL:claude-opus-5}
    default-max-tokens: ${LEXFLOW_LLM_MAX_TOKENS:16000}
    connect-timeout: 5s
    # Rede de segurança da camada HTTP; quem corta a tentativa, normalmente, é o time limiter.
    response-timeout: ${LEXFLOW_LLM_RESPONSE_TIMEOUT:190s}
    # Quando o modelo recusa um pedido por política, o provedor tenta outro modelo na mesma chamada.
    # O modelo que respondeu fica registrado na resposta. Vazio desliga.
    refusal-fallback: ${LEXFLOW_LLM_REFUSAL_FALLBACK:default}
  # Base normativa do RAG (Prompt 12). O provedor de embeddings é separado do LLM: a Anthropic não
  # expõe endpoint de embeddings. Sem chave, a aplicação sobe e só a indexação e a recuperação falham.
  embeddings:
    base-url: ${LEXFLOW_EMBEDDINGS_BASE_URL:https://api.voyageai.com}
    path: ${LEXFLOW_EMBEDDINGS_PATH:/v1/embeddings}
    api-key: ${LEXFLOW_EMBEDDINGS_API_KEY:${VOYAGE_API_KEY:}}
    model: ${LEXFLOW_EMBEDDINGS_MODEL:voyage-3-large}
    # Precisa ser igual à dimensão da coluna vector da migration V1; mudar exige reindexar a base.
    dimension: 1536
    batch-size: ${LEXFLOW_EMBEDDINGS_BATCH_SIZE:32}
    connect-timeout: 5s
    response-timeout: ${LEXFLOW_EMBEDDINGS_RESPONSE_TIMEOUT:60s}
    # Um trecho acima do limite do modelo é cortado pelo provedor, em vez de derrubar o lote inteiro.
    truncate-input: true
  knowledge-base:
    # Divisão das fontes normativas em trechos. Alterar só afeta o que for indexado a partir daqui.
    chunk-max-characters: ${LEXFLOW_KB_CHUNK_MAX_CHARACTERS:1200}
    chunk-overlap-characters: ${LEXFLOW_KB_CHUNK_OVERLAP:200}
    # Quantos trechos são levados ao modelo por pergunta jurídica (Prompt 13).
    retrieval-limit: ${LEXFLOW_KB_RETRIEVAL_LIMIT:5}
    # Trechos menos próximos que isso são descartados: norma irrelevante no contexto convida à alucinação.
    min-similarity: ${LEXFLOW_KB_MIN_SIMILARITY:0.2}
  # Etapas do pipeline assíncrono.
  pipeline:
    fact-extraction:
      # Extração de fatos via LLM (Prompt 11). Desligada, a demanda para em EXTRACTING sem chamar o LLM.
      enabled: ${LEXFLOW_FACT_EXTRACTION_ENABLED:true}
      # Documentos maiores recebem alerta para tratamento humano; nunca são truncados.
      max-document-characters: ${LEXFLOW_FACT_EXTRACTION_MAX_CHARACTERS:400000}
  # Extração de texto dos documentos (Prompt 08). O OCR usa o Tesseract instalado na máquina,
  # com os pacotes de idioma informados.
  extraction:
    ocr-language: ${LEXFLOW_OCR_LANGUAGE:por}
    tesseract-path: ${LEXFLOW_TESSERACT_PATH:}
    ocr-timeout: ${LEXFLOW_OCR_TIMEOUT:2m}
    ocr-dpi: ${LEXFLOW_OCR_DPI:300}
    min-native-characters-per-page: 10

# Resiliência das integrações externas (seção 11). A instância "llm" protege o cliente LLM.
resilience4j:
  timelimiter:
    instances:
      llm:
        # Tempo máximo de cada tentativa. Uma resposta sem streaming com raciocínio pode levar minutos.
        timeout-duration: ${LEXFLOW_LLM_TIMEOUT:180s}
        cancel-running-future: true
      embeddings:
        # Embeddings são rápidos: um lote que passa disso indica provedor degradado.
        timeout-duration: ${LEXFLOW_EMBEDDINGS_TIMEOUT:45s}
        cancel-running-future: true
  retry:
    instances:
      llm:
        # Três tentativas no total, com espera de 2s, 4s... até 20s.
        max-attempts: ${LEXFLOW_LLM_MAX_ATTEMPTS:3}
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 20s
        # Só falhas transitórias do provedor. Pedido recusado, resposta fora do schema, recusa do
        # modelo e circuito aberto não são repetidos.
        retry-exceptions:
          - com.lexflow.application.llm.LlmUnavailableException
          - java.util.concurrent.TimeoutException
          - io.github.resilience4j.bulkhead.BulkheadFullException
      embeddings:
        max-attempts: ${LEXFLOW_EMBEDDINGS_MAX_ATTEMPTS:3}
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 10s
        retry-exceptions:
          - com.lexflow.application.knowledge.EmbeddingUnavailableException
          - java.util.concurrent.TimeoutException
          - io.github.resilience4j.bulkhead.BulkheadFullException
  circuitbreaker:
    instances:
      llm:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        # Chamadas lentas também abrem o circuito: um provedor degradado prende threads tanto quanto
        # um fora do ar.
        slow-call-duration-threshold: 120s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: ${LEXFLOW_LLM_CIRCUIT_OPEN_WAIT:30s}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.lexflow.application.llm.LlmUnavailableException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - com.lexflow.application.llm.LlmRequestRejectedException
          - io.github.resilience4j.bulkhead.BulkheadFullException
      embeddings:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 30s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: ${LEXFLOW_EMBEDDINGS_CIRCUIT_OPEN_WAIT:30s}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.lexflow.application.knowledge.EmbeddingUnavailableException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - com.lexflow.application.knowledge.EmbeddingRequestRejectedException
          - io.github.resilience4j.bulkhead.BulkheadFullException
  bulkhead:
    instances:
      llm:
        # Chamadas simultâneas ao LLM por réplica: o resto espera um pouco e, depois, falha como
        # indisponibilidade — a mensagem volta para a fila, sem travar o worker.
        max-concurrent-calls: ${LEXFLOW_LLM_MAX_CONCURRENT_CALLS:16}
        max-wait-duration: 10s
      embeddings:
        max-concurrent-calls: ${LEXFLOW_EMBEDDINGS_MAX_CONCURRENT_CALLS:8}
        max-wait-duration: 10s

server:
  port: ${LEXFLOW_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${LEXFLOW_DB_URL:jdbc:postgresql://localhost:5432/lexflow}
    username: ${LEXFLOW_DB_USERNAME:lexflow}
    password: ${LEXFLOW_DB_PASSWORD:lexflow}

lexflow:
  storage:
    endpoint: ${LEXFLOW_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${LEXFLOW_STORAGE_ACCESS_KEY:lexflow}
    secret-key: ${LEXFLOW_STORAGE_SECRET_KEY:lexflow123}
    # O MinIO endereça o bucket no caminho da URL.
    path-style-access: true
    # Conveniência de desenvolvimento: se o bucket não existir, a primeira gravação o cria.
    create-bucket-if-missing: true
  security:
    admin:
      username: ${LEXFLOW_ADMIN_USERNAME:admin}
      password: ${LEXFLOW_ADMIN_PASSWORD:lexflow-admin}

management:
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: prod

lexflow:
  storage:
    # Em produção o bucket vem do provisionamento, e as credenciais da cadeia padrão do SDK
    # (role da instância ou variáveis de ambiente) — nunca deste arquivo.
    create-bucket-if-missing: false

management:
  endpoint:
    health:
      show-details: never
